apiVersion: batch/v1
kind: Job
metadata:
  name: gopasal-migrate
  labels:
    app.kubernetes.io/name: gopasal-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gopasal-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.invalid/gopasal/api:replace-me
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: gopasal-config
            - secretRef:
                name: gopasal-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
